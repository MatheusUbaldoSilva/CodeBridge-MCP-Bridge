<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="static/xterm.css">
<style>
html, body, #terminal { width:100%; height:100%; margin:0; background:#0c0c0c; overflow:hidden; }
body { user-select:text; }
.xterm { padding:6px; }
</style>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="static/xterm.js"></script>
<script src="static/addon-fit.js"></script>
</head>
<body>
<div id="terminal"></div>
<script>
const term = new Terminal({
  cursorBlink: true,
  convertEol: false,
  scrollback: 5000,
  fontFamily: 'Cascadia Mono, Consolas, monospace',
  fontSize: 13,
  theme: { background:'#0c0c0c', foreground:'#cccccc', cursor:'#ffffff' }
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('terminal'));
fit.fit();
let bridge = null;
new QWebChannel(qt.webChannelTransport, channel => {
  bridge = channel.objects.bridge;
  bridge.output.connect(data => term.write(data));
  bridge.reset_terminal.connect(() => term.reset());
  term.onData(data => bridge.input(data));
  term.onResize(size => bridge.resize(size.cols, size.rows));
  bridge.ready();
  bridge.resize(term.cols, term.rows);
  term.focus();
});
window.addEventListener('resize', () => { fit.fit(); if (bridge) bridge.resize(term.cols, term.rows); });
window.cbFit = () => {
  fit.fit();
  if (bridge && term.cols >= 20 && term.rows >= 5) bridge.resize(term.cols, term.rows);
};
window.cbFocus = () => term.focus();
</script>
</body>
</html>
